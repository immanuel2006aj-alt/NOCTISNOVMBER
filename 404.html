<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Page Not Found — Noctis Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=DM+Sans:wght@400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#111118;--gold:#c9a84c;--gold2:#e5cc83;--ink:#f5f5f7;--muted:#a1a1aa;--line:#292934;--serif:"Playfair Display",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;--mono:"DM Mono",monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:24px}
.box{max-width:560px;width:100%;text-align:center;border:1px solid var(--line);background:var(--surface);padding:clamp(32px,6vw,60px);position:relative}
.box:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold)}
.code{font:500 clamp(5rem,18vw,9rem)/1 var(--serif);color:var(--gold2);letter-spacing:-.04em;margin:0}
.label{font:10px var(--mono);letter-spacing:.2em;color:var(--gold2);text-transform:uppercase;margin:14px 0 0}
h1{font:500 clamp(1.6rem,4vw,2.2rem)/1.15 var(--serif);margin:20px 0 12px}
p{color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 28px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{min-height:46px;padding:0 22px;border:1px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:.25s;border-radius:2px}
.btn.gold{background:var(--gold);color:#111}
.btn.outline{color:var(--gold2);background:transparent}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px #c9a84c20}
.btn.outline:hover{background:var(--gold);color:#111}
.hint{margin-top:26px;font:9px var(--mono);letter-spacing:.14em;color:#55555f;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="box" role="main">
  <p class="code">404</p>
  <p class="label">Page Not Found</p>
  <h1>This Page Doesn't Exist.</h1>
  <p>The link may be broken, or the page may have moved. Let's get you back on track.</p>
  <div class="actions">
    <a class="btn gold" href="https://www.noctistechnologies.gt.tc/">← Back to Home</a>
    <a class="btn outline" href="https://www.noctistechnologies.gt.tc/#contact">Contact Noctis</a>
  </div>
  <p class="hint">Noctis Technologies · Tirupur</p>
</main>
</body>
</html>
